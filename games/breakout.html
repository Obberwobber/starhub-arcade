<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout — StarHub Arcade</title>
<link rel="stylesheet" href="../game.css">
<style>
canvas.game { touch-action: none; border-radius: 12px; box-shadow: 0 10px 44px rgba(0,0,0,.5); }
</style>
</head><body>
<header class="topbar">
  <a class="back" href="../index.html">&larr; Arcade</a>
  <h1>BREAKOUT</h1>
  <span class="hint">Mouse / <span class="kbd">&larr;</span><span class="kbd">&rarr;</span> move &middot; <span class="kbd">Space</span> launch &middot; <span class="kbd">P</span> pause &middot; <span class="kbd">R</span> restart</span>
</header>
<main class="stage">
  <canvas class="game" id="c"></canvas>
  <div class="scorebar">
    <span>SCORE <span id="sEl">0</span></span>
    <span>BEST <span class="b" id="bEl">0</span></span>
    <span>LIVES <span id="lEl">3</span></span>
    <span>LEVEL <span id="lvEl">1</span></span>
  </div>
  <div class="overlay" id="overlay">
    <h2>BREAKOUT</h2>
    <p>Smash every brick with the ball. Move the paddle with your mouse, finger, or arrow keys.
       The ball speeds up as bricks fall. Clear all 6 rows for the next level — you have 3 lives.</p>
    <button class="btn" id="startBtn">Play</button>
  </div>
</main>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const overlay = document.getElementById('overlay'), startBtn = document.getElementById('startBtn');
const sEl = document.getElementById('sEl'), bEl = document.getElementById('bEl');
const lEl = document.getElementById('lEl'), lvEl = document.getElementById('lvEl');
const LS = 'arcade_best_breakout';
const VW = 820, VH = 560;

/* Fit canvas into the stage, keeping aspect, rendering at devicePixelRatio for crispness. */
function fit() {
  const r = cv.parentElement.getBoundingClientRect();
  const k = Math.max(.3, Math.min((r.width - 24) / VW, (r.height - 24) / VH));
  cv.style.width = VW * k + 'px';
  cv.style.height = VH * k + 'px';
  const d = Math.min(devicePixelRatio || 1, 2) * k;
  cv.width = Math.round(VW * d);
  cv.height = Math.round(VH * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
addEventListener('resize', fit);
fit();

const ROWS = 6, COLS = 10;
const COLORS = ['#ff5964', '#ff9f43', '#ffd166', '#4ade80', '#6ee7ff', '#a78bfa'];
const PTS = [60, 50, 40, 30, 20, 10]; // top rows are worth more
const pad = { w: 110, h: 14, x: VW / 2, y: VH - 42 };
const ball = { x: VW / 2, y: VH - 50, r: 7, vx: 0, vy: 0, sp: 370, stuck: true };
let bricks = [], left = 0;
let score = 0, lives = 3, level = 1;
let state = 'menu', paused = false; // menu | play | over
let best = +localStorage.getItem(LS) || 0;
const keys = {};

function build() {
  bricks = []; left = ROWS * COLS;
  const m = 26, top = 70, gap = 6, bh = 20;
  const bw = (VW - m * 2 - gap * (COLS - 1)) / COLS;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      bricks.push({ x: m + c * (bw + gap), y: top + r * (bh + gap), w: bw, h: bh,
                    col: COLORS[r], pts: PTS[r], on: true });
}

function serve() {
  pad.x = VW / 2;
  pad.w = Math.max(72, 110 - (level - 1) * 8);
  ball.stuck = true;
  ball.sp = Math.min(370 + (level - 1) * 32, 700);
  ball.x = pad.x; ball.y = pad.y - ball.r - 1;
  ball.vx = 0; ball.vy = 0;
}

function hud() {
  sEl.textContent = score; bEl.textContent = best;
  lEl.textContent = lives; lvEl.textContent = level;
}

function launch() {
  if (!ball.stuck) return;
  ball.stuck = false;
  const a = -Math.PI / 2 + (Math.random() * .6 - .3);
  ball.vx = Math.cos(a) * ball.sp;
  ball.vy = Math.sin(a) * ball.sp;
}

function start() {
  score = 0; lives = 3; level = 1; paused = false;
  build(); serve(); hud();
  state = 'play';
  overlay.hidden = true;
}

function gameOver() {
  state = 'over';
  best = Math.max(best, score);
  localStorage.setItem(LS, best);
  hud();
  overlay.innerHTML =
    '<h2>GAME OVER</h2>' +
    '<p>Final score <b>' + score + '</b> &middot; Best <b>' + best + '</b><br>' +
    'Press <span class="kbd">R</span> or <span class="kbd">Space</span> to play again.</p>' +
    '<button class="btn" id="startBtn">Restart</button>';
  overlay.hidden = false;
  overlay.querySelector('button').onclick = start;
}
startBtn.onclick = start;

function step(dt) {
  /* paddle keyboard control */
  const pv = 640;
  if (keys.ArrowLeft || keys.a || keys.A) pad.x -= pv * dt;
  if (keys.ArrowRight || keys.d || keys.D) pad.x += pv * dt;
  pad.x = Math.max(pad.w / 2, Math.min(VW - pad.w / 2, pad.x));

  if (ball.stuck) { ball.x = pad.x; ball.y = pad.y - ball.r - 1; return; }

  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  /* walls */
  if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
  if (ball.x + ball.r > VW) { ball.x = VW - ball.r; ball.vx = -Math.abs(ball.vx); }
  if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy = Math.abs(ball.vy); }

  /* paddle — bounce angle depends on where the ball lands */
  if (ball.vy > 0 && ball.y + ball.r >= pad.y && ball.y - ball.r <= pad.y + pad.h &&
      Math.abs(ball.x - pad.x) <= pad.w / 2 + ball.r) {
    const off = Math.max(-1, Math.min(1, (ball.x - pad.x) / (pad.w / 2)));
    const a = -Math.PI / 2 + off * 1.08; // up to ~62 degrees off vertical
    ball.vx = Math.cos(a) * ball.sp;
    ball.vy = Math.sin(a) * ball.sp;
    ball.y = pad.y - ball.r;
  }

  /* bricks — circle vs rect */
  for (const b of bricks) {
    if (!b.on) continue;
    const nx = Math.max(b.x, Math.min(ball.x, b.x + b.w));
    const ny = Math.max(b.y, Math.min(ball.y, b.y + b.h));
    const dx = ball.x - nx, dy = ball.y - ny;
    if (dx * dx + dy * dy > ball.r * ball.r) continue;
    b.on = false; left--;
    score += b.pts;
    ball.sp = Math.min(ball.sp + 7, 760); // speed up as bricks break
    /* flip along the axis of least penetration, then renormalize to new speed */
    const ox = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
    const oy = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
    if (ox < oy) ball.vx = -ball.vx; else ball.vy = -ball.vy;
    const m = Math.hypot(ball.vx, ball.vy) || 1;
    ball.vx = ball.vx / m * ball.sp;
    ball.vy = ball.vy / m * ball.sp;
    break; // one brick per frame
  }

  if (left === 0) { level++; build(); serve(); hud(); return; }

  /* lost the ball */
  if (ball.y - ball.r > VH) {
    lives--; hud();
    if (lives <= 0) { gameOver(); return; }
    serve();
  }
  hud();
}

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function draw() {
  ctx.clearRect(0, 0, VW, VH);
  /* backdrop */
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#0e1230'); g.addColorStop(1, '#0b0e1a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  ctx.strokeStyle = '#2a3257'; ctx.lineWidth = 3;
  ctx.strokeRect(1.5, 1.5, VW - 3, VH - 3);

  /* bricks — solid bright color with a light top + dark bottom bevel */
  for (const b of bricks) {
    if (!b.on) continue;
    ctx.fillStyle = b.col;
    rr(b.x, b.y, b.w, b.h, 4); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.32)';
    rr(b.x + 1.5, b.y + 1.5, b.w - 3, 4, 2); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.30)';
    rr(b.x + 1.5, b.y + b.h - 5.5, b.w - 3, 4, 2); ctx.fill();
  }

  /* paddle */
  const pg = ctx.createLinearGradient(0, pad.y, 0, pad.y + pad.h);
  pg.addColorStop(0, '#6ee7ff'); pg.addColorStop(1, '#3b82f6');
  ctx.fillStyle = pg;
  rr(pad.x - pad.w / 2, pad.y, pad.w, pad.h, 7); ctx.fill();

  /* ball — soft outer glow plus the lit core */
  ctx.save();
  const glow = ctx.createRadialGradient(ball.x, ball.y, 0, ball.x, ball.y, ball.r * 3);
  glow.addColorStop(0, 'rgba(110,231,255,.45)'); glow.addColorStop(1, 'rgba(110,231,255,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r * 3, 0, 7); ctx.fill();
  ctx.shadowColor = '#6ee7ff'; ctx.shadowBlur = 16;
  ctx.fillStyle = '#f2feff';
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, 7); ctx.fill();
  ctx.restore();

  if (ball.stuck && state === 'play' && !paused) {
    ctx.fillStyle = 'rgba(232,236,255,.55)';
    ctx.font = '600 15px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('SPACE / CLICK TO LAUNCH', VW / 2, VH - 80);
  }
  if (paused) {
    ctx.fillStyle = 'rgba(8,11,24,.6)'; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = '#e8ecff'; ctx.font = '800 34px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', VW / 2, VH / 2);
  }
}

let last = 0;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min((t - last) / 1000 || 0, .033);
  last = t;
  if (state === 'play' && !paused) step(dt);
  draw();
}
requestAnimationFrame(frame);

/* ---- input ---- */
const STOP = new Set([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown']);
addEventListener('keydown', e => {
  if (STOP.has(e.key)) e.preventDefault();
  if (e.repeat) return;
  keys[e.key] = true;
  const k = e.key.toLowerCase();
  if (k === 'r') { start(); return; }
  if (e.key === ' ') {
    if (state !== 'play') start();
    else if (!paused) launch();
    return;
  }
  if ((k === 'p' || e.key === 'Escape') && state === 'play') paused = !paused;
});
addEventListener('keyup', e => keys[e.key] = false);

function pointX(e) {
  const r = cv.getBoundingClientRect();
  pad.x = (e.clientX - r.left) / r.width * VW;
}
cv.addEventListener('pointermove', pointX);
cv.addEventListener('pointerdown', e => {
  pointX(e);
  if (state === 'play' && !paused) launch();
});
</script>
</body></html>

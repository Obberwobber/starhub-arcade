<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simon — StarHub Arcade</title>
<link rel="stylesheet" href="../game.css">
<style>
.simon {
  position: relative; width: min(82vw, 400px); aspect-ratio: 1;
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  background: radial-gradient(circle at 50% 34%, #33373f 0%, #1b1e23 55%, #101216 100%);
  border-radius: 50%; padding: 22px;
  box-shadow:
    0 18px 50px rgba(0,0,0,.6),
    inset 0 2px 4px rgba(255,255,255,.18),
    inset 0 -6px 14px rgba(0,0,0,.55),
    0 0 0 5px #05060a;
}
.simon::after { /* glossy sheen across the whole plastic toy */
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  background: radial-gradient(ellipse at 50% 12%, rgba(255,255,255,.16), rgba(255,255,255,0) 42%);
  pointer-events: none; z-index: 4;
}
.pad {
  position: relative; overflow: hidden; opacity: .5;
  cursor: pointer; transition: opacity .09s, filter .09s;
  touch-action: manipulation;
  box-shadow: inset 0 -8px 14px rgba(0,0,0,.35), inset 0 4px 8px rgba(255,255,255,.18);
}
.pad::before { /* glossy highlight on each wedge */
  content: ''; position: absolute; inset: 0; border-radius: inherit;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,255,255,.38), rgba(255,255,255,0) 55%);
}
.pad.p0 { background: #00a74a; border-top-left-radius: 100%; }
.pad.p1 { background: #cf1124; border-top-right-radius: 100%; }
.pad.p2 { background: #e0b700; border-bottom-left-radius: 100%; }
.pad.p3 { background: #1256c4; border-bottom-right-radius: 100%; }
.pad.lit { opacity: 1; filter: brightness(1.55) saturate(1.2); }
.pad.lit.p0 { box-shadow: inset 0 2px 10px rgba(255,255,255,.4), 0 0 40px #22c55e; }
.pad.lit.p1 { box-shadow: inset 0 2px 10px rgba(255,255,255,.4), 0 0 40px #ef4444; }
.pad.lit.p2 { box-shadow: inset 0 2px 10px rgba(255,255,255,.4), 0 0 40px #eab308; }
.pad.lit.p3 { box-shadow: inset 0 2px 10px rgba(255,255,255,.4), 0 0 40px #3b82f6; }
.hub {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  width: 40%; aspect-ratio: 1; border-radius: 50%;
  background: radial-gradient(circle at 50% 32%, #23262c, #0d0f12 78%);
  border: 4px solid #05070a;
  box-shadow: 0 1px 0 rgba(255,255,255,.14), inset 0 3px 8px rgba(0,0,0,.85);
  z-index: 2;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-weight: 900; letter-spacing: 1px; text-align: center; pointer-events: none;
}
.hub .brand { font-size: clamp(10px, 3vw, 14px); letter-spacing: 4px; color: #e8ecf2; font-weight: 900; }
.hub .st { font-size: 11px; color: var(--dim); font-weight: 700; letter-spacing: 2px; }
.hub .n { font-size: 30px; color: var(--acc); }
</style>
</head><body>
<header class="topbar">
  <a class="back" href="../index.html">&larr; Arcade</a>
  <h1>SIMON</h1>
  <span class="hint">Click pads or keys <span class="kbd">1</span>&ndash;<span class="kbd">4</span> &middot; repeat the pattern</span>
</header>
<main class="stage">
  <div class="scorebar"><span>Round <span id="round">&ndash;</span></span><span class="b">Best <span id="best">0</span></span></div>
  <div class="simon" id="simon">
    <div class="pad p0" data-i="0"></div><div class="pad p1" data-i="1"></div>
    <div class="pad p2" data-i="2"></div><div class="pad p3" data-i="3"></div>
    <div class="hub"><span class="brand">SIMON</span><span class="st" id="st">READY</span><span class="n" id="n"></span></div>
  </div>
  <div class="overlay" id="overlay"><h2>SIMON</h2><p>Watch the pattern of lights and tones, then repeat it back. The sequence grows by one step every round. One wrong pad ends the run!</p><button class="btn" id="startBtn">Play</button></div>
</main>
<script>
'use strict';
const pads = [...document.querySelectorAll('.pad')];
const roundEl = document.getElementById('round'), bestEl = document.getElementById('best');
const stEl = document.getElementById('st'), nEl = document.getElementById('n');
const overlay = document.getElementById('overlay'), startBtn = document.getElementById('startBtn');
const KEY = 'arcade_best_simon';
let best = +localStorage.getItem(KEY) || 0;
bestEl.textContent = best;

const FREQ = [392.0, 329.63, 261.63, 196.0]; // green, red, yellow, blue
let AC = null;
function tone(f, dur, type, vol) {
  AC = AC || new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state === 'suspended') AC.resume();
  const t = AC.currentTime;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol || .16, t + .015);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t); o.stop(t + dur + .05);
}

let seq = [], round = 0, idx = 0, accepting = false;

function lite(i, ms) {
  pads[i].classList.add('lit');
  setTimeout(() => pads[i].classList.remove('lit'), ms);
}
function setStatus(s, n) { stEl.textContent = s; nEl.textContent = n; }

function playSeq() {
  accepting = false;
  setStatus('WATCH', round);
  const dur = Math.max(190, 400 - round * 15);
  seq.forEach((v, k) => {
    setTimeout(() => { lite(v, dur * .55); tone(FREQ[v], dur * .55 / 1000 + .18); }, 450 + k * (dur + 130));
  });
  setTimeout(() => { idx = 0; accepting = true; setStatus('YOUR TURN', round); }, 450 + seq.length * (dur + 130) + 200);
}

function press(i) {
  if (!accepting) return;
  lite(i, 220);
  tone(FREQ[i], .3);
  if (i !== seq[idx]) { fail(); return; }
  idx++;
  if (idx === seq.length) {
    accepting = false;
    setStatus('GOOD!', round);
    setTimeout(next, 900);
  }
}

function next() {
  round++;
  roundEl.textContent = round;
  seq.push(Math.floor(Math.random() * 4));
  playSeq();
}

function fail() {
  accepting = false;
  tone(120, .7, 'sawtooth', .2);
  setStatus('OOPS', round);
  if (round > best) { best = round; localStorage.setItem(KEY, best); bestEl.textContent = best; }
  overlay.querySelector('h2').textContent = 'GAME OVER';
  overlay.querySelector('p').innerHTML = 'You reached <b style="color:var(--acc)">Round ' + round + '</b> &middot; Best: <b style="color:var(--gold)">' + best + '</b>';
  startBtn.textContent = 'Play Again';
  setTimeout(() => { overlay.hidden = false; }, 650);
}

function start() {
  overlay.hidden = true;
  tone(440, .08, 'sine', 0); // unlock/resume audio context on user gesture
  seq = []; round = 0; idx = 0;
  roundEl.textContent = '–';
  setStatus('WATCH', '');
  setTimeout(next, 500);
}

pads.forEach(p => p.addEventListener('pointerdown', () => press(+p.dataset.i)));
addEventListener('keydown', e => {
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
  if (e.key >= '1' && e.key <= '4') press(+e.key - 1);
  if ((e.key === ' ' || e.key === 'Enter') && !overlay.hidden) startBtn.click();
});
startBtn.addEventListener('click', start);
</script>
</body></html>

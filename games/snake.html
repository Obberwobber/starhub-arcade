<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake — StarHub Arcade</title>
<link rel="stylesheet" href="../game.css">
<style>
#c{background:#a2d149;border-radius:8px;touch-action:none;box-shadow:0 12px 44px rgba(0,0,0,.5)}
</style>
</head><body>
<header class="topbar">
  <a class="back" href="../index.html">&larr; Arcade</a>
  <h1>Snake</h1>
  <span class="hint">Arrows/WASD or swipe &middot; <span class="kbd">P</span> pause &middot; <span class="kbd">R</span> restart</span>
</header>
<main class="stage">
  <canvas class="game" id="c"></canvas>
  <div class="scorebar"><span>Score <span id="score">0</span></span><span class="b">Best <span id="best">0</span></span></div>
  <div class="overlay" id="overlay"><h2>SNAKE</h2><p>Eat the apples to grow. Don&rsquo;t hit the walls or your own tail. Steer with arrow keys, WASD, or swipes.</p><button class="btn" id="startBtn">Play</button></div>
</main>
<script>
const GRID=20,CELL=24,W=GRID*CELL;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
const overlay=document.getElementById('overlay'),stage=document.querySelector('.stage');
let snake,dir,pend,food,score,tick,acc,dead=false,paused=false,running=false;
let best=+(localStorage.getItem('arcade_best_snake')||0);
bestEl.textContent=best;
const dpr=Math.min(devicePixelRatio||1,2);
cv.width=W*dpr;ctx.scale(dpr,dpr);
function fit(){const s=Math.max(200,Math.min(stage.clientWidth-20,stage.clientHeight-20));cv.style.width=cv.style.height=s+'px';}
fit();addEventListener('resize',fit);

function reset(){
  snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};pend=[];
  score=0;tick=150;acc=0;dead=false;paused=false;spawn();
  scoreEl.textContent='0';
}
function spawn(){
  const free=[];
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++)
    if(!snake.some(s=>s.x===x&&s.y===y))free.push({x,y});
  food=free.length?free[Math.random()*free.length|0]:null;
}
function step(){
  if(pend.length){const d=pend.shift();if(d.x!==-dir.x||d.y!==-dir.y)dir=d;}
  const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(h.x<0||h.y<0||h.x>=GRID||h.y>=GRID||snake.some(s=>s.x===h.x&&s.y===h.y))return over();
  snake.unshift(h);
  if(food&&h.x===food.x&&h.y===food.y){
    score+=10;scoreEl.textContent=score;tick=Math.max(65,tick-3);spawn();
  }else snake.pop();
}
function over(){
  dead=true;running=false;
  best=Math.max(best,score);localStorage.setItem('arcade_best_snake',best);bestEl.textContent=best;
  overlay.innerHTML='<h2>GAME OVER</h2><p>Score: <b>'+score+'</b> &nbsp;&middot;&nbsp; Best: <b>'+best+'</b></p><button class="btn">Restart</button>';
  overlay.hidden=false;overlay.querySelector('.btn').onclick=start;
}
function start(){overlay.hidden=true;reset();running=true;}
document.getElementById('startBtn').onclick=start;

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(!overlay.hidden){if(k===' '||k==='enter'||k==='r')overlay.querySelector('.btn').click();return;}
  const m={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]}[k];
  if(m){
    const d={x:m[0],y:m[1]},last=pend.length?pend[pend.length-1]:dir;
    if((d.x!==-last.x||d.y!==-last.y)&&pend.length<3)pend.push(d);
    return;
  }
  if(k==='p'||k==='escape')paused=!paused;
  else if(k==='r')start();
});
let tx=0,ty=0;
cv.addEventListener('touchstart',e=>{const t=e.touches[0];tx=t.clientX;ty=t.clientY;},{passive:true});
cv.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
cv.addEventListener('touchend',e=>{
  const t=e.changedTouches[0],dx=t.clientX-tx,dy=t.clientY-ty;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  const d=Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)};
  const last=pend.length?pend[pend.length-1]:dir;
  if((d.x!==-last.x||d.y!==-last.y)&&pend.length<3)pend.push(d);
},{passive:true});

function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(100,ts-last);last=ts;
  if(running&&!paused&&!dead){acc+=dt;while(acc>=tick){acc-=tick;step();if(dead)break;}}
  draw();
}
function draw(){
  /* Google-style light-green checkerboard */
  for(let y=0;y<GRID;y++)for(let x=0;x<GRID;x++){
    ctx.fillStyle=(x+y)%2?'#a2d149':'#aad751';
    ctx.fillRect(x*CELL,y*CELL,CELL,CELL);
  }
  if(food){
    const fx=food.x*CELL+CELL/2,fy=food.y*CELL+CELL/2;
    ctx.fillStyle='#e03131';ctx.beginPath();ctx.arc(fx,fy+1,CELL*.36,0,7);ctx.fill();
    ctx.strokeStyle='#8b5a2b';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(fx,fy-CELL*.28);ctx.lineTo(fx+2,fy-CELL*.46);ctx.stroke();
    ctx.fillStyle='#43a047';ctx.beginPath();ctx.ellipse(fx+5,fy-CELL*.42,4,2.4,-.6,0,7);ctx.fill();
  }
  if(snake)snake.forEach((s,i)=>{
    const px=s.x*CELL,py=s.y*CELL;
    ctx.fillStyle=i?'#4a7ddc':'#3a63b8';
    rr(px+.5,py+.5,CELL-1,CELL-1,5);ctx.fill();
    if(!i){
      const ox=dir.y*4.5,oy=dir.x*4.5,cx=px+CELL/2+dir.x*3,cy=py+CELL/2+dir.y*3;
      ctx.fillStyle='#fff';
      ctx.beginPath();ctx.arc(cx+ox,cy+oy,3.4,0,7);ctx.arc(cx-ox,cy-oy,3.4,0,7);ctx.fill();
      ctx.fillStyle='#1c2f5e';
      ctx.beginPath();ctx.arc(cx+ox+dir.x*1.2,cy+oy+dir.y*1.2,1.6,0,7);ctx.arc(cx-ox+dir.x*1.2,cy-oy+dir.y*1.2,1.6,0,7);ctx.fill();
    }
  });
  if(paused){
    ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,0,W,W);
    ctx.fillStyle='#fff';ctx.font='700 28px system-ui';ctx.textAlign='center';
    ctx.textBaseline='middle';ctx.fillText('PAUSED',W/2,W/2);
  }
}
reset();requestAnimationFrame(frame);
</script>
</body></html>
